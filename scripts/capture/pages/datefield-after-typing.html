<!doctype html><meta charset="utf-8"><title>date after typing</title><link rel=stylesheet href=_base.css>
<!-- The sequence from the DemoQA recording that has never been explained: type
     in one field, then press a date field that opens its calendar on focus.
     The calendar kept being credited to the step that opens it rather than to
     the one after, and in isolation the date field alone does not reproduce it.
     The typing before it is the only other ingredient. -->
<label for="phone">Phone</label>
<input id="phone" name="phone" type="text" autocomplete="off">
<br><br>
<input id="dob" type="text" readonly placeholder="Pick a date">
<div id="cal" hidden style="margin-top:8px;padding:12px;background:#eee">
  <svg id="tri" width="12" height="12"><polygon points="0,12 6,0 12,12"/></svg>
  <select id="month"><option>Sep</option><option>Oct</option></select>
  <button id="day-9">9</button>
</div>
<script>
  const cal = document.getElementById('cal');
  // React commits after the handler returns, so the calendar lands a frame
  // later rather than during the event. That is the timing being reproduced.
  document.getElementById('dob').addEventListener('focus', () => {
    requestAnimationFrame(() => { cal.hidden = false; });
  });
</script>
<script src="harness.js"></script>
