<!doctype html><meta charset="utf-8"><title>scoring</title><link rel=stylesheet href=_base.css>
<!-- One of each kind of handle a page can offer, so the order the scorer puts
     them in is checked against a real layout rather than a described one. -->
<button data-testid="save-order" id="save" class="btn primary">Save</button>
<button id="cancel" class="btn">Cancel</button>
<input name="email" type="text" aria-label="Email address">
<button aria-label="Close dialog" class="css-1x9d8f">×</button>
<button class="shrink-0 btn">Shrink</button>

<!-- Three that differ only by position: nothing here identifies them. -->
<ul id="rows">
  <li><span class="cell">one</span></li>
  <li><span class="cell">two</span></li>
  <li><span class="cell">three</span></li>
</ul>

<!-- Element Plus: the class that says it is focused is not a way to find it,
     and the counter id is usable but has to carry a warning. -->
<div id="el-id-1024-3" class="el-select__wrapper el-tooltip__trigger is-focused" tabindex="0">Select</div>

<!-- DemoQA's date of birth field. The class is one react-datepicker adds while
     the calendar is open, so it is not there when a replay needs to click. -->
<input id="dateOfBirthInput" class="form-control react-datepicker-ignore-onclickoutside">

<!-- A Vue component: every element in it carries the same build-time hash, and
     the id beside it is the only real handle. -->
<button data-v-7ba5bd90 id="pay" class="el-button">Pay</button>

<!-- The only id this button has is regenerated on every render. -->
<button id="_R_ajekmbjqfsua_" class="ant-btn">Submit order</button>

<!-- Same text on two links; only the href tells them apart. -->
<a href="/users/1" class="profile">View profile</a>
<a href="/users/2" class="profile">View profile</a>
<script src="harness.js"></script>
