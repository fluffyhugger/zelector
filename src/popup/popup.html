<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Zelector</title>
    <style>
      :root { color-scheme: dark; }
      body {
        margin: 0; width: 264px;
        font: 13px/1.5 ui-sans-serif, system-ui, -apple-system, sans-serif;
        background: #16142a; color: #e9e7f5;
      }
      header {
        display: flex; align-items: center; gap: 8px;
        padding: 11px 14px; border-bottom: 1px solid #2f2a4d;
      }
      header .dot { width: 8px; height: 8px; border-radius: 50%; background: #7c5cff; }
      header h1 { font-size: 13px; margin: 0; letter-spacing: .02em; }
      menu { list-style: none; margin: 0; padding: 7px; }
      button.item {
        width: 100%; display: flex; align-items: center; gap: 10px;
        font: inherit; text-align: left; color: #e9e7f5;
        background: none; border: 1px solid transparent; border-radius: 8px;
        padding: 9px 10px; cursor: pointer;
      }
      button.item:hover { background: #1e1b38; border-color: #3a3363; }
      button.item .glyph { font-size: 14px; width: 18px; text-align: center; }
      button.item.rec .glyph { color: #f87171; }
      button.item.pick .glyph { color: #c4b5fd; }
      button.item.freeze .glyph { color: #6ee7b7; }
      button.item .label { flex: 1; }
      button.item .sub { display: block; font-size: 10.5px; color: #7d7799; }
      kbd {
        font: 11px ui-monospace, Menlo, monospace; color: #a99ee0;
        background: #221e3e; border: 1px solid #3a3363;
        border-radius: 4px; padding: 2px 6px; white-space: nowrap;
      }
      kbd.unset { color: #fca5a5; border-color: #6b2c2c; }
      hr { border: 0; border-top: 1px solid #221e3e; margin: 5px 9px; }
      .note {
        margin: 0; padding: 9px 14px 11px; font-size: 10.5px; color: #56507a;
        border-top: 1px solid #2f2a4d;
      }
      .note a { color: #7d76a8; }
      .note.error { color: #fca5a5; }
    </style>
  </head>
  <body>
    <header>
      <span class="dot"></span>
      <h1>Zelector</h1>
    </header>

    <menu>
      <li>
        <button class="item rec" id="rec" type="button">
          <span class="glyph">⏺</span>
          <span class="label">Record a flow<span class="sub" id="rec-sub">clicks, typing, waits</span></span>
          <kbd id="kbd-rec">—</kbd>
        </button>
      </li>
      <li>
        <button class="item pick" id="pick" type="button">
          <span class="glyph">◎</span>
          <span class="label">Pick an element<span class="sub">scored selectors + code</span></span>
          <kbd id="kbd-pick">—</kbd>
        </button>
      </li>
      <hr />
      <li>
        <button class="item freeze" id="freeze" type="button">
          <span class="glyph">❄</span>
          <span class="label">Freeze the DOM<span class="sub">hold hover menus open</span></span>
          <kbd id="kbd-freeze">—</kbd>
        </button>
      </li>
    </menu>

    <p class="note" id="note"></p>
    <script src="popup.js"></script>
  </body>
</html>
